name: Publish to npm

on:
  push:
    tags:
      - 'v*'

# All versions share a lock; never interrupt an upload that npm may have accepted.
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm if version is new
        run: node .github/scripts/publish.mjs
