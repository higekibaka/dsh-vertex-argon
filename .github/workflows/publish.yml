name: Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish package to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure latest npm for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Publish to npm if version is new
        run: |
          PKG_NAME=$(node -p "require('./package.json').name")
          LOCAL_VER=$(node -p "require('./package.json').version")
          REMOTE_VER=$(npm view "$PKG_NAME@$LOCAL_VER" version --registry=https://registry.npmjs.org/ 2>/dev/null || true)
          if [ "$LOCAL_VER" = "$REMOTE_VER" ]; then
            echo "Version $LOCAL_VER is already published on npm. Skipping."
            exit 0
          fi
          echo "Publishing $PKG_NAME@$LOCAL_VER via OIDC Trusted Publisher..."
          npm publish --provenance --access public --registry=https://registry.npmjs.org/
